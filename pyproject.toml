[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "swirl-spectra"
dynamic = ["version"]
description = "Open-source processing, interpretation and visualisation of VNIR-SWIR point spectra for exploration geology"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehdi Serdoun" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
swirl = "swirl.cli:main"

[project.urls]
Homepage = "https://github.com/MSerdoun/SWIRL"

[tool.hatch.version]
path = "src/swirl/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/swirl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
# numpy stubs use 3.12 syntax; the 3.11 CI job still checks runtime compatibility.
python_version = "3.12"
strict = true
files = ["src/swirl"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true
