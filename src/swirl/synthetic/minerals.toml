# Generic synthetic end-members for development and calibration.
#
# STATUS: first-pass values chosen by the developer from general knowledge of these spectra.
# They are placeholders to exercise the code, NOT a reference library. They must be reviewed
# by the project's SWIR expert before any interpretation algorithm is calibrated on them.
#
# Model (see swirl.synthetic.generate):
#   R(λ) = C(λ) · Π_i [1 - depth_i · exp(-4 ln2 (λ - center_i)² / fwhm_i²)]
# where C is a monotone cubic (PCHIP) through the continuum anchors.
# `depth` is therefore the depth relative to the continuum at the band centre, exact for an
# isolated band; overlapping bands shift the apparent minimum and depth.
#
# Units: wavelength and fwhm in nm, reflectance and depth as fractions.

[white_mica]
label = "White mica (muscovite-like, AlOH ~2200 nm)"
continuum = [[350, 0.45], [600, 0.62], [1000, 0.72], [1400, 0.78], [2000, 0.76], [2500, 0.68]]
features = [
    { center = 1408, fwhm = 20, depth = 0.12, assignment = "OH" },
    { center = 1912, fwhm = 40, depth = 0.05, assignment = "H2O" },
    { center = 2120, fwhm = 25, depth = 0.04, assignment = "AlOH shoulder" },
    { center = 2200, fwhm = 38, depth = 0.35, assignment = "AlOH" },
    { center = 2350, fwhm = 25, depth = 0.15, assignment = "AlOH secondary" },
    { center = 2440, fwhm = 25, depth = 0.10, assignment = "AlOH secondary" },
]

